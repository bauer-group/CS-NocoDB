# =============================================================================
# Dependabot Configuration
# =============================================================================
# Monitors Docker base images and GitHub Actions for updates
# Combined with docker-maintenance.yml workflow for auto-merge and release.
# Base image updates change the shipped images, so they are committed as
# fix(docker): the release dispatched after the merge cuts a PATCH and
# pushes the rebuilt images. GitHub Actions updates (chore(ci)) release
# nothing and are merged by hand.
# =============================================================================

version: 2
updates:
  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # Docker base image updates - NocoDB
  - package-ecosystem: "docker"
    directory: "/src/nocodb"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # Docker base image updates - Init
  - package-ecosystem: "docker"
    directory: "/src/nocodb-init"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # NOTE: /src/nocodb-backup is intentionally NOT watched by Dependabot.
  # It is a meta image FROM the internal ghcr.io/bauer-group/cs-backuphelper
  # engine (floating :latest by policy); the docker-base-image-monitor tracks
  # that digest (BACKUPHELPER_LATEST_DIGEST) and triggers a rebuild when it moves.
