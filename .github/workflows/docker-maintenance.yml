# =============================================================================
# Docker Maintenance - Auto-merge Dependabot PRs (every ecosystem)
# =============================================================================
# Every Dependabot PR reaches this workflow (no paths: filter), so each one
# gets an explicit decision and annotation instead of silently staying open.
# A PR is merged only after the pull_request run of docker-release.yml passed
# on its head commit - compose and script validation, the three image builds
# and the backup round trips (fresh, cluster and upgrade from the latest
# release, each with the images built from the PR):
#
#   docker          src/nocodb/Dockerfile       image built, round trips run
#                   src/nocodb-init/Dockerfile  image built, round trips run
#   github-actions  .github/workflows/**        never merged: a CI change
#
# A PR whose files do not start docker-release.yml (pull_request paths) stays
# open as "not tested". The merge is made with GITHUB_TOKEN and starts no
# push workflow, so the release follows with the next push to main or a
# manual run of docker-release.yml.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the images and runs the backup round trip.
      required-workflows: '.github/workflows/docker-release.yml'
    secrets: inherit
