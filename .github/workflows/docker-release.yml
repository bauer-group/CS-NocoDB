name: 🚀 Release & Docker Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - 'tests/backup-roundtrip/**'
      - '.github/workflows/docker-release.yml'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  # Required by docker-build.yml@main: a declared permissions: block sets every
  # unlisted scope to none, and the reusable workflow now needs these three.
  attestations: write   # write the build-provenance attestation
  id-token: write       # OIDC token to sign the attestation (keyless/Sigstore)
  actions: read         # its nested security-analysis job reads run metadata

jobs:
  # ============================================
  # Validation Jobs
  # ============================================

  validate-compose:
    name: 🔍 Validate Docker Compose
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: '["docker-compose.local.yml", "docker-compose.traefik.yml", "docker-compose.traefik-header-auth.yml", "docker-compose.development.yml"]'
      env-file: '.env.example'

  validate-scripts:
    name: 🔍 Validate Shell Scripts
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-shellscript.yml@main
    with:
      scan-directory: '.'
      severity: 'error'

  # ============================================
  # Backup round trip (gates every release)
  # ============================================
  # Builds all three images from this commit, starts the local stack with the
  # backup profile, seeds a record with an attachment through NocoDB, backs it
  # up, deletes it, restores the snapshot and checks that NocoDB has it back.
  # Every release rebuilds the images FROM the newest NocoDB and BackupHelper
  # bases - also the one the base image monitor dispatches - so this runs on
  # every push, dispatch and relevant PR. Docs-only pushes never reach it
  # (paths-ignore).

  backup-roundtrip:
    name: 🧪 Backup Round Trip
    needs: [validate-compose, validate-scripts]
    permissions:
      contents: read
      packages: read
    uses: bauer-group/automation-templates/.github/workflows/modules-backup-roundtrip-test.yml@main
    with:
      compose-file: 'docker-compose.local.yml'
      profiles: 'backup'
      # A GitHub-hosted runner, not a production host: smaller PostgreSQL
      # memory, a plain-HTTP site URL and a recognisable stack name. No mail
      # server: NocoDB skips its SMTP setup without a host. The backup schedule
      # moves to a 24-hour interval, so no scheduled run (cron 05:15) can start
      # in the middle of the test.
      env-overrides: |
        STACK_NAME=nocodb_roundtrip
        NC_SITE_URL=http://localhost:8080
        PG_SHARED_BUFFERS=256MB
        PG_EFFECTIVE_CACHE_SIZE=1GB
        PG_MAINTENANCE_WORK_MEM=64MB
        SMTP_HOST=
        NOCODB_BACKUP_SCHEDULE_MODE=interval
        NOCODB_BACKUP_SCHEDULE_INTERVAL_HOURS=24
      generated-secrets: 'DATABASE_PASSWORD NC_AUTH_JWT_SECRET'
      build-images: |
        [
          {"service": "nocodb-server", "context": "src/nocodb"},
          {"service": "nocodb-init", "context": "src/nocodb-init"},
          {"service": "nocodb-backup", "context": "src/nocodb-backup"}
        ]
      backup-service: 'nocodb-backup'
      # database: pg_dump, nocodb-data: the data volume (attachments), nocodb:
      # the REST export - seed.sh creates the API token it needs.
      require-components: 'database nocodb-data nocodb'
      services-to-stop-before-restore: 'nocodb-server'
      seed-script: 'tests/backup-roundtrip/seed.sh'
      mutate-script: 'tests/backup-roundtrip/mutate.sh'
      check-script: 'tests/backup-roundtrip/check.sh'
    secrets: inherit

  # The same round trip on the cluster stack (docker-compose.cluster.yml:
  # HAProxy, nocodb-server-1..4, Redis), with tests/backup-roundtrip/cluster/
  # docker-compose.ci.yml merged over it for a runner without Traefik. The
  # restore runs while every instance keeps serving, the case the sidecar's
  # post_restore hook exists for: the instances share their metadata cache in
  # Redis, and the mutation also drops a field that only an emptied cache
  # brings back. The check then asks every instance directly.

  backup-roundtrip-cluster:
    name: 🧪 Backup Round Trip (Cluster)
    needs: [validate-compose, validate-scripts]
    permissions:
      contents: read
      packages: read
    uses: bauer-group/automation-templates/.github/workflows/modules-backup-roundtrip-test.yml@main
    with:
      compose-files: '["docker-compose.cluster.yml", "tests/backup-roundtrip/cluster/docker-compose.ci.yml"]'
      profiles: 'backup'
      # Stage S of .env.example (4 instances), sized for a GitHub-hosted
      # runner (4 cores, 16 GB) instead of a 16-core host: no CPU limit above
      # the runner's cores (Docker rejects it), memory ceilings of 9.25 GB in
      # all (4 x 1.5 GB NocoDB, 2 GB PostgreSQL, 0.5 GB Redis, 0.25 GB HAProxy,
      # 0.5 GB init). Compose creates the proxy network (CI override).
      # Plain-HTTP site URL, no mail server, no scheduled backup during the
      # test - as in the single-instance round trip.
      env-overrides: |
        STACK_NAME=nocodb_cluster_roundtrip
        PROXY_NETWORK=nocodb_cluster_roundtrip_proxy
        NC_SITE_URL=http://localhost:8080
        NOCODB_CPU_LIMIT=1.0
        NOCODB_MEMORY_LIMIT=1536M
        POSTGRES_CPU_LIMIT=2.0
        POSTGRES_MEMORY_LIMIT=2G
        PG_SHARED_BUFFERS_CLUSTER=256MB
        PG_EFFECTIVE_CACHE_SIZE_CLUSTER=1GB
        PG_WORK_MEM_CLUSTER=4MB
        PG_MAINTENANCE_WORK_MEM_CLUSTER=64MB
        REDIS_CPU_LIMIT=0.5
        REDIS_MEMORY_LIMIT=512M
        REDIS_MEMORYLIMIT=256mb
        HAPROXY_CPU_LIMIT=0.5
        HAPROXY_MEMORY_LIMIT=256M
        SMTP_HOST=
        NOCODB_BACKUP_SCHEDULE_MODE=interval
        NOCODB_BACKUP_SCHEDULE_INTERVAL_HOURS=24
      generated-secrets: 'DATABASE_PASSWORD NC_AUTH_JWT_SECRET HAPROXY_STATS_PASSWORD'
      # One build for all instances: they share one image reference.
      build-images: |
        [
          {"service": "nocodb-server-1", "context": "src/nocodb"},
          {"service": "nocodb-init", "context": "src/nocodb-init"},
          {"service": "nocodb-backup", "context": "src/nocodb-backup"}
        ]
      backup-service: 'nocodb-backup'
      require-components: 'database nocodb-data nocodb'
      # No services-to-stop-before-restore on purpose: see above.
      seed-script: 'tests/backup-roundtrip/cluster/seed.sh'
      mutate-script: 'tests/backup-roundtrip/cluster/mutate.sh'
      check-script: 'tests/backup-roundtrip/cluster/check.sh'
      artifact-name: 'backup-roundtrip-cluster-diagnostics'
    secrets: inherit

  # ============================================
  # Release Job (only on main branch push)
  # ============================================

  release:
    name: 📦 Create Semantic Release
    needs: [validate-compose, validate-scripts, backup-roundtrip, backup-roundtrip-cluster]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.backup-roundtrip.result == 'success' &&
      needs.backup-roundtrip-cluster.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit

  # ============================================
  # Main Docker Build Jobs
  # ============================================

  docker-build-release:
    name: 🐳 Build & Push Main Image
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-NocoDB/nocodb'
      docker-image-name: 'bauergroup/nocodb'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './src/nocodb/Dockerfile'
      docker-context: './src/nocodb'
      platforms: 'linux/amd64'

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: true
    secrets: inherit

  docker-build-pr:
    name: 🔨 Validate Docker Build (PR)
    needs: [validate-compose, validate-scripts]
    if: |
      github.event_name == 'pull_request' &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-NocoDB/nocodb'

      auto-tags: true
      dockerfile-path: './src/nocodb/Dockerfile'
      docker-context: './src/nocodb'
      platforms: 'linux/amd64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # Init Docker Build Jobs
  # ============================================

  docker-build-init-release:
    name: 🐳 Build & Push Init Image
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-NocoDB/nocodb-init'
      docker-image-name: 'bauergroup/nocodb-init'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './src/nocodb-init/Dockerfile'
      docker-context: './src/nocodb-init'
      platforms: 'linux/amd64'

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: true
    secrets: inherit

  docker-build-init-pr:
    name: 🔨 Validate Init Build (PR)
    needs: [validate-compose, validate-scripts]
    if: |
      github.event_name == 'pull_request' &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-NocoDB/nocodb-init'

      auto-tags: true
      dockerfile-path: './src/nocodb-init/Dockerfile'
      docker-context: './src/nocodb-init'
      platforms: 'linux/amd64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # Backup Docker Build Jobs
  # ============================================

  docker-build-backup-release:
    name: 🐳 Build & Push Backup Image
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-NocoDB/nocodb-backup'
      docker-image-name: 'bauergroup/nocodb-backup'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './src/nocodb-backup/Dockerfile'
      docker-context: './src/nocodb-backup'
      platforms: 'linux/amd64'

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: true
    secrets: inherit

  docker-build-backup-pr:
    name: 🔨 Validate Backup Build (PR)
    needs: [validate-compose, validate-scripts]
    if: |
      github.event_name == 'pull_request' &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-NocoDB/nocodb-backup'

      auto-tags: true
      dockerfile-path: './src/nocodb-backup/Dockerfile'
      docker-context: './src/nocodb-backup'
      platforms: 'linux/amd64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit
